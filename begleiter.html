:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#1D2733; --muted:#66727F; --line:#D8DEE4;
  --accent:#B7434F; --accent-ink:#FFFFFF; --soft:#F5E3E5;
  --i1:#EDB93A; --i2:#E5792B; --i3:#C4202E; --ok:#3F8F4E;
  --serif: 'MTRound', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10161C; --card:#18212A; --ink:#E6EBF0; --muted:#94A1AE; --line:#2A3540;
    --accent:#E58A93; --accent-ink:#2B0F13; --soft:#3A2226;
    --i1:#F2C552; --i2:#F08A3E; --i3:#EF4B4F; --ok:#7CC489; color-scheme: dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:0}
h1.msg{font-size:21px;line-height:1.25;color:var(--accent);overflow-wrap:anywhere}
h1.msg.long{font-size:18px}
.clock{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;min-height:92px;padding:12px 16px;border:1px solid var(--line);background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .08s}
.big:active{transform:scale(.97)}
.big b{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.15}
.big small{font-size:13px;color:var(--muted);margin-top:3px}
.big.pain{border-color:var(--accent);background:var(--soft)}
.big.pain.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big.pain.on small{color:var(--accent-ink);opacity:.85}
.big.wide{grid-column:1 / -1;min-height:88px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.done{border-color:var(--accent)}
.done .l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.done b{font-size:17px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.q{font-size:14px;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600}
.chip.on{border-color:var(--accent);background:var(--soft)}
.chips{margin-top:10px}
.risk{border-left:5px solid var(--i1);padding:12px 14px}
.risk.risk-hi{border-left-color:var(--i2)}
.risk.risk-lo{border-left-color:var(--ok)}
.risk summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.risk summary::-webkit-details-marker{display:none}
.risk .rt{font-size:16px}
.risk .rt span{color:var(--muted)}
.risk .ra{font-size:14px;color:var(--muted);line-height:1.35}
.risk .rmore{font-size:14px;color:var(--accent);font-weight:600;margin-top:4px}
.risk .rmore::before{content:'▸ '}
.risk[open] .rmore::before{content:'▾ '}
.risk p{margin:8px 0 0;font-size:14.5px;line-height:1.4}
.foodrow{display:flex;gap:8px;margin-top:10px}
.foodrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit;-webkit-user-select:text;user-select:text}
.chips.sug{margin-top:8px}
.chips.sug:empty{display:none}
.chips.sug .chip{min-height:38px;font-weight:500;background:var(--bg)}
.timer{height:3px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);animation:shrink linear forwards;transform-origin:left}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.atk{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px;margin:0 0 10px}
.atkhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px;font-size:15px}
.atkhead b{font-family:var(--serif);font-size:22px}
.atk .big{background:var(--card);color:var(--ink);border-color:transparent}
.big.sm{min-height:72px;justify-content:center}
.big.end{background:var(--soft)}
.grid.g3{grid-template-columns:1fr 1fr 1fr}
.g3 .big{min-height:88px;padding:12px}
.g3 .big b{font-size:18px}
h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:22px 2px 8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row .t{font-variant-numeric:tabular-nums;color:var(--muted);width:44px;flex:none}
.row .x1{flex:1;min-width:0}
.row .st{font-size:12.5px;color:var(--muted);white-space:nowrap}
.row .st.ok{color:var(--ok)}
.row .del{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px 2px 4px 8px}
.empty{padding:12px 14px;color:var(--muted);font-size:14.5px}
.status{margin:12px 4px 0;font-size:13.5px;color:var(--muted);text-align:center}
.status.ok{color:var(--ok)}
.hint{font-size:14px;color:var(--muted);margin:0}
.tip{border-style:dashed}
.setup input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit;margin:10px 0 8px;-webkit-user-select:text;user-select:text}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
</style>
</head>

function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(st)); }catch(_){} }
var st = load(), cfg = parseLink(location.hash) || st.cfg || null;
if(cfg && location.hash && parseLink(location.hash)){
  if(st.cfg && (st.cfg.t!==cfg.t || st.cfg.k!==cfg.k)){ st.entries = []; st.acked = {}; }
  if(st.meds && st.cfg && st.cfg.t===cfg.t && !cfg.m.length) cfg.m = st.meds;
}
st.cfg = cfg; st.entries = st.entries || []; st.acked = st.acked || {}; st.lists = st.lists || {};
if(cfg && cfg.m && cfg.m.length && !(st.lists.m && st.lists.m.length)) st.lists.m = cfg.m;
persist();

var flash = null, flashTimer = null, net = '', syncing = false, ask = null;
function list(k){ return (st.lists && st.lists[k]) || []; }
function live(){ return st.entries.filter(function(e){ return !e.del; }); }
function openPain(){
  var cut = Date.now()-36*3600000, L = live();
  var starts = L.filter(function(e){ return e.k==='pain' && e.ts>cut; });
  for(var i=starts.length-1;i>=0;i--){ var s = starts[i]; if(!L.some(function(e){ return e.k==='painEnd' && e.ref===s.id; })) return s; }
  return null;
}
function levelNow(p){
  var v = p.v || START_LEVEL;
  live().filter(function(e){ return e.k==='lvl' && e.ref===p.id; }).sort(function(a,b){ return a.ts-b.ts; })
    .forEach(function(e){ v = Math.max(1, Math.min(10, v + e.d)); });
  return v;
}
function levelAfter(e){
  var p = st.entries.filter(function(x){ return x.id===e.ref; })[0]; if(!p) return null;
  var v = p.v || START_LEVEL;
  live().filter(function(x){ return x.k==='lvl' && x.ref===p.id && (x.ts<e.ts || (x.ts===e.ts && x.id<=e.id)); }).sort(function(a,b){ return a.ts-b.ts; })
    .forEach(function(x){ v = Math.max(1, Math.min(10, v + x.d)); });
  return v;
}
function label(e){
  if(e.k==='meal') return 'Gegessen'+(e.n ? ': '+e.n : '');
  if(e.k==='drink'){ var d = DRINKS.filter(function(x){ return x[0]===e.s; })[0]; return 'Getrunken'+(d && e.s!=='other' ? ': '+d[1] : ''); }
  if(e.k==='move') return 'Sport'+(e.n ? ': '+e.n : '')+(e.i ? ' ('+(e.i==='hard' ? 'intensiv' : 'leicht')+')' : '');
  if(e.k==='stomach') return e.s==='bloat' ? 'Bauch: aufgebläht' : 'Bauchschmerzen'+(e.v ? ' '+e.v+'/5' : '');
  if(e.k==='nausea') return 'Übelkeit'+(e.v ? ' '+e.v+'/5' : '');
  if(e.k==='med') return 'Medikament'+(e.n ? ': '+e.n : '');
  if(e.k==='pain') return 'Kopfschmerz beginnt';
  if(e.k==='lvl') return e.d>0 ? 'Stärker' : 'Schwächer';
  if(e.k==='painEnd') return 'Kopfschmerz vorbei';
  return e.k;
}
function pending(){ var cut = Date.now()-PEND_MS; return st.entries.filter(function(e){ return e.ts>cut && st.acked[e.id]!==e.u; }); }
function showFlash(id, choices){
  flash = {id:id, choices:choices||null, until:Date.now()+CHOICE_MS};
  clearTimeout(flashTimer); flashTimer = setTimeout(function(){ if(typing()) return; flash = null; render(); }, CHOICE_MS);
}
function typing(){ var a = document.activeElement; return !!(a && a.id==='foodIn'); }
function add(k, extra, choices){
  var now = Date.now(), e = {id:uid(), ts:now, u:now, k:k};
  for(var x in extra) e[x] = extra[x];
  st.entries.push(e);
  st.entries = st.entries.filter(function(y){ return y.ts>now-KEEP_MS; });
  persist();
  showFlash(e.id, choices);
  render(); sync();
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(_){}
  return e;
}
function upd(id, fields, next){
  var e = st.entries.filter(function(y){ return y.id===id; })[0]; if(!e) return;
  for(var x in fields) e[x] = fields[x];
  e.u = Date.now(); persist();
  showFlash(id, next||null); render(); sync();
}
function remove(id){
  var e = st.entries.filter(function(y){ return y.id===id; })[0]; if(!e) return;
  var now = Date.now(); e.del = 1; e.u = now;
  if(e.k==='pain') st.entries.forEach(function(y){ if((y.k==='painEnd' || y.k==='lvl') && y.ref===e.id && !y.del){ y.del = 1; y.u = now; } });
  if(flash && flash.id===id) flash = null;
  persist(); render(); sync();
}
function endPain(){
  var p = openPain(); if(!p) return;
  add('painEnd', {ref:p.id});
}

/* ---- Senden und Bestätigungen abholen ---- */
function fetchAcks(){
  return Promise.all(['-ok','-v'].map(function(suf){ return fetch(NTFY+cfg.t+suf+'/json?poll=1&since=all', {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http'); return r.text(); }); }))
  .then(function(two){ return two.join('\n'); }).then(function(txt){
    var msgs = txt.split('\n').filter(Boolean).map(function(l){ try{ return JSON.parse(l); }catch(_){ return null; } }).filter(function(m){ return m && m.event==='message'; });
    return Promise.all(msgs.map(function(m){ return unseal(m.message).then(function(p){ return {time:m.time, p:p}; }, function(){ return null; }); }));
  }).then(function(res){
    res.filter(Boolean).sort(function(a,b){ return a.time-b.time; }).forEach(function(x){
      (x.p.a||[]).forEach(function(pair){ st.acked[pair[0]] = pair[1]; });
      ['m','d','s','w'].forEach(function(k){ if(Array.isArray(x.p[k])) st.lists[k] = x.p[k].slice(0, k==='w' ? 400 : 16); });
      if(typeof x.p.msg==='string') st.msg = x.p.msg;
      if('r' in x.p) st.risk = x.p.r;
      if(x.p.at) st.lastSeen = Math.max(st.lastSeen||0, x.p.at);
    });
    /* alte Bestätigungen aufräumen */
    var ids = {}; st.entries.forEach(function(e){ ids[e.id] = 1; });
    Object.keys(st.acked).forEach(function(k){ if(!ids[k]) delete st.acked[k]; });
    persist();
  });
}
function publish(){
  var p = pending(); if(!p.length) return Promise.resolve();
  var sig = p.map(function(e){ return e.id+':'+e.u; }).join(',');
  if(sig===st.lastSig && Date.now()-(st.lastSend||0)<RESEND_MS) return Promise.resolve();
  /* in Pakete aufteilen (älteste zuerst), damit jede Nachricht unter der ntfy-Grenze von 4 KB bleibt */
  var enc = new TextEncoder(), chunks = [[]];
  p.slice().sort(function(a,b){ return a.ts-b.ts; }).forEach(function(e){
    var o = {id:e.id, ts:e.ts, u:e.u, k:e.k}; ['v','n','s','i','d','ref','del'].forEach(function(f){ if(e[f]!=null) o[f] = e[f]; });
    var last = chunks[chunks.length-1];
    if(last.length && enc.encode(JSON.stringify({v:1, e:last.concat([o])})).length > 2800) chunks.push([o]); else last.push(o);
  });
  return chunks.reduce(function(prev, ch){
    return prev.then(function(){ return seal({v:1, e:ch}); }).then(function(msg){ return fetch(NTFY+cfg.t, {method:'POST', body:msg}); }).then(function(r){ if(!r.ok) throw new Error('http'); });
  }, Promise.resolve()).then(function(){ st.lastSig = sig; st.lastSend = Date.now(); persist(); });
}
var again = false;
function sync(){
  if(!cfg) return;
  if(syncing){ again = true; return; }
  syncing = true; again = false;
  var done = function(){ syncing = false; render(); if(again) sync(); };
  fetchAcks().catch(function(){}).then(publish).then(function(){ net = 'ok'; done(); }, function(){ net = 'off'; done(); });
}

/* ---- Anzeige ---- */
function statusHtml(){
  var p = pending().filter(function(e){ return !e.del; }).length;
  if(!p && net!=='off') return '<p class="status ok">Alles angekommen.</p>';
  if(net==='off') return '<p class="status">Gerade keine Verbindung. '+(p ? (p===1 ? '1 Eintrag wird' : p+' Einträge werden')+' gesendet, sobald Internet da ist.' : '')+'</p>';
  return '<p class="status">'+(p===1 ? '1 Eintrag ist' : p+' Einträge sind')+' unterwegs – das andere Handy holt '+(p===1 ? 'ihn' : 'sie')+' beim nächsten Öffnen ab.</p>';
}
function chipsHtml(id, field, items, cur){
  return '<div class="chips">'+items.map(function(it){ var v = it[0], l = it[1];
    return '<button class="chip'+(cur===v?' on':'')+'" data-act="pick" data-id="'+id+'" data-f="'+field+'" data-v="'+esc(v)+'">'+esc(l)+'</button>'; }).join('')+'</div>';
}
function flashHtml(){
  var fe = flash && live().filter(function(e){ return e.id===flash.id; })[0];
  if(!fe) return '';
  var left = Math.max(0, flash.until-Date.now());
  var h = '<div class="card done"><div class="l1"><b>'+esc(label(fe))+'</b><button class="link" data-act="undo" data-id="'+fe.id+'">Rückgängig</button></div>'+
    '<p class="hint" style="margin-top:2px">gemerkt um '+hm(fe.ts)+'</p>';
  var ch = flash.choices, cv = fe.v!=null ? String(fe.v) : null;
  if(ch==='drink') h += chipsHtml(fe.id, 's', DRINKS, fe.s);
  else if(ch==='pain') h += '<p class="q">Wie stark?</p>'+chipsHtml(fe.id, 'v', PAIN, cv);
  else if(ch==='meal'){
    if(list('d').length) h += chipsHtml(fe.id, 'n', list('d').map(function(x){ return [x, x]; }), fe.n);
    h += '<div class="foodrow"><input id="foodIn" data-id="'+fe.id+'" type="text" placeholder="Oder eintippen …" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"><button class="chip" data-act="foodok" data-id="'+fe.id+'">OK</button></div><div class="chips sug" id="foodSug"></div>';
  }
  else if(ch==='move' && list('s').length) h += chipsHtml(fe.id, 'n', list('s').map(function(x){ return [x, x]; }), fe.n);
  else if(ch==='move') h += '<p class="q">Wie anstrengend?</p>'+chipsHtml(fe.id, 'i', INTENS, fe.i);
  else if(ch==='moveInt') h += '<p class="q">Wie anstrengend?</p>'+chipsHtml(fe.id, 'i', INTENS, fe.i);
  else if(ch==='stomach') h += chipsHtml(fe.id, 's', BELLY, fe.s);
  else if(ch==='stomachLvl' || ch==='nausea') h += '<p class="q">Wie stark? (1 = kaum, 5 = sehr)</p>'+chipsHtml(fe.id, 'v', ONE5, cv);
  else if(ch==='med' && list('m').length) h += chipsHtml(fe.id, 'n', list('m').map(function(x){ return [x, x]; }), fe.n);
  h += '<div class="timer"><i style="animation-duration:'+left+'ms"></i></div></div>';
  return h;
}
function askHtml(){
  if(ask!=='endmed') return '';
  return '<div class="card done"><b>Medikament genommen?</b><p class="hint" style="margin:2px 0 10px">Während dieser Attacke ist noch keins eingetragen.</p>'+
    (list('m').length ? '<div class="chips">'+list('m').map(function(x){ return '<button class="chip" data-act="endmed" data-n="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+
      '<button class="chip" data-act="endmed" data-n="">Anderes</button></div>' : '<div class="chips"><button class="chip" data-act="endmed" data-n="">Ja</button></div>')+
    '<div class="two"><button class="chip" data-act="endnomed">Nein, keins</button><button class="chip" data-act="endcancel">Doch nicht vorbei</button></div></div>';
}
function render(){
  var app = document.getElementById('app');
  if(typing()) return; /* nicht mitten im Tippen neu zeichnen */
  if(!cfg){
    app.innerHTML = '<div class="top"><h1>Migräne unterwegs</h1></div><div class="card setup"><b>Noch nicht verbunden</b>'+
      '<p class="hint" style="margin-top:6px">Scanne den QR-Code aus der Migräne-App (Einstellungen → Zweites Handy) oder füge hier den Link ein.</p>'+
      '<input id="linkIn" type="url" placeholder="Link einfügen" autocomplete="off"><button class="btn" id="linkOk" type="button">Verbinden</button></div>';
    return;
  }
  var now = Date.now(), op = openPain(), h = '';
  var msg = (st.msg||'').trim();
  h += '<div class="top">'+(msg ? '<h1 class="msg'+(msg.length>60 ? ' long' : '')+'">'+esc(msg)+'</h1>' : '<h1>Schnell eintragen</h1>')+'<span class="clock">'+hm(now)+'</span></div>';
  var rk = st.risk, td = new Date(), tdIso = td.getFullYear()+'-'+pad(td.getMonth()+1)+'-'+pad(td.getDate());
  if(rk && rk.d===tdIso && !op){
    h += '<details class="card risk risk-'+(rk.l==='erhöht' ? 'hi' : (rk.l==='mittel' ? 'mid' : 'lo'))+'"'+(st.riskOpen ? ' open' : '')+'><summary><span class="rt"><b>Risiko heute: '+esc(rk.l)+'</b>'+(rk.p!=null ? ' <span>(ca. '+rk.p+'%)</span>' : '')+'</span>'+
      ((rk.a||[]).length ? '<span class="ra">'+rk.a.map(esc).join(' · ')+'</span>' : '')+'<span class="rmore">Mehr dazu</span></summary>'+
      (rk.m||[]).map(function(x){ return '<p>'+esc(x)+'</p>'; }).join('')+'</details>';
  }
  var standalone = window.navigator.standalone===true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if(!standalone && !st.tipDone && /iPhone|iPad|iPod/.test(navigator.userAgent)){
    h += '<div class="card tip"><p class="hint"><b style="color:var(--ink)">Tipp:</b> Unten auf „Teilen“ tippen und „Zum Home-Bildschirm“ wählen – dann ist das hier wie eine eigene App.</p>'+
      '<button class="link" data-act="tipok" style="margin-top:6px">Verstanden</button></div>';
  }
  h += askHtml() || flashHtml();
  if(op){
    h += '<div class="atk"><div class="atkhead"><span>Kopfschmerz seit '+hm(op.ts)+'</span></div><div class="grid">'+
      '<button class="big sm" data-act="worse"><b>Stärker</b></button><button class="big sm" data-act="better"><b>Schwächer</b></button>'+
      '<button class="big sm" data-act="med"><b>Medikament</b></button><button class="big sm end" data-act="end"><b>Ende</b></button></div></div>';
    h += '<div class="grid g3"><button class="big" data-act="meal"><b>Gegessen</b></button><button class="big" data-act="drink"><b>Getrunken</b></button><button class="big" data-act="move"><b>Sport</b></button>'+
      '<button class="big" data-act="stomach"><b>Bauch</b></button><button class="big" data-act="nausea"><b>Übelkeit</b></button></div>';
  } else {
    h += '<div class="grid"><button class="big pain wide" data-act="pain"><b>Kopfschmerz beginnt</b><small>jetzt</small></button>'+
      '<button class="big" data-act="meal"><b>Gegessen</b></button><button class="big" data-act="drink"><b>Getrunken</b></button>'+
      '<button class="big" data-act="move"><b>Sport</b></button><button class="big" data-act="med"><b>Medikament</b></button>'+
      '<button class="big" data-act="stomach"><b>Bauch</b></button><button class="big" data-act="nausea"><b>Übelkeit</b></button></div>';
  }
  var today = live().filter(function(e){ return sameDay(e.ts, now); }).sort(function(a,b){ return b.ts-a.ts || (b.id<a.id?-1:1); });
  h += '<h2>Heute</h2><div class="list">'+(today.length ? today.map(function(e){
    var ok = st.acked[e.id]===e.u;
    return '<div class="row"><span class="t">'+hm(e.ts)+'</span><span class="x1">'+esc(label(e))+'</span><span class="st'+(ok?' ok':'')+'">'+(ok ? 'angekommen' : 'unterwegs')+'</span>'+
      '<button class="del" data-act="del" data-id="'+e.id+'" aria-label="Löschen">×</button></div>';
  }).join('') : '<div class="empty">Heute noch nichts markiert.</div>')+'</div>';
  h += statusHtml();
  app.innerHTML = h;
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('[data-act],#linkOk') : null; if(!b) return;
  if(b.id==='linkOk'){
    var c = parseLink((document.getElementById('linkIn')||{}).value||'');
    if(!c){ document.getElementById('linkIn').value = ''; document.getElementById('linkIn').placeholder = 'Link nicht erkannt – bitte nochmal'; return; }
    location.hash = (document.getElementById('linkIn').value.split('#')[1]||''); location.reload(); return;
  }
  var a = b.getAttribute('data-act'), id = b.getAttribute('data-id'), op = openPain();
  /* angefangenen Essens-Text nicht verlieren, wenn gleich ein anderer Knopf getippt wird */
  var fi = document.getElementById('foodIn');
  if(fi && fi.value.replace(/[\s,]+$/, '').trim() && a!=='foodok' && a!=='sugpick'){
    var fe0 = st.entries.filter(function(y){ return y.id===fi.getAttribute('data-id'); })[0];
    if(fe0){ fe0.n = fi.value.replace(/[\s,]+$/, '').trim(); fe0.u = Date.now(); persist(); }
    fi.value = '';
  }
  if(a==='pain') add('pain', {v:START_LEVEL}, 'pain');
  else if(a==='worse' && op) add('lvl', {ref:op.id, d:1});
  else if(a==='better' && op) add('lvl', {ref:op.id, d:-1});
  else if(a==='end' && op){
    var hadMed = live().some(function(e){ return e.k==='med' && e.ts>=op.ts; });
    if(hadMed) endPain(); else { ask = 'endmed'; flash = null; render(); }
  }
  else if(a==='endmed'){ ask = null; var n = b.getAttribute('data-n'); add('med', n ? {n:n} : {}); endPain(); }
  else if(a==='endnomed'){ ask = null; endPain(); }
  else if(a==='endcancel'){ ask = null; render(); }
  else if(a==='meal' || a==='drink' || a==='move' || a==='med' || a==='stomach' || a==='nausea') add(a, {}, a);
  else if(a==='pick'){
    var f = b.getAttribute('data-f'), v = b.getAttribute('data-v'), o = {}, ch = flash && flash.choices, next = null;
    o[f] = f==='v' ? parseInt(v, 10) : v;
    if(ch==='move' && f==='n') next = 'moveInt';
    if(ch==='moveInt') next = null;
    if(ch==='stomach' && v==='pain') next = 'stomachLvl';
    if(ch==='stomach' && v==='bloat') o.v = null;
    upd(id, o, next);
  }
  else if(a==='foodok'){ saveFood(id); }
  else if(a==='sugpick'){ pickSug(b.getAttribute('data-v')); }
  else if(a==='undo' || a==='del') remove(id);
  else if(a==='tipok'){ st.tipDone = true; persist(); render(); }
});
/* ---- Essen eintippen, mit Vorschlägen aus der Haupt-App ---- */
function vocab(){
  var seen = {}, out = [];
  list('d').concat(list('w')).forEach(function(x){ var k = String(x).toLowerCase(); if(!seen[k]){ seen[k] = 1; out.push(String(x)); } });
  return out;
}
function saveFood(id){
  var inp = document.getElementById('foodIn'); if(!inp) return;
  var v = inp.value.replace(/[\s,]+$/, '').trim();
  inp.blur();
  if(v) upd(id || inp.getAttribute('data-id'), {n:v}); else { if(flash) showFlash(flash.id, flash.choices); render(); }
}
function pickSug(word){
  var inp = document.getElementById('foodIn'); if(!inp) return;
  var parts = inp.value.split(','); parts[parts.length-1] = (parts.length>1 ? ' ' : '')+word;
  inp.value = parts.join(',')+', '; inp.focus(); showSug();
}
function showSug(){
  var inp = document.getElementById('foodIn'), box = document.getElementById('foodSug'); if(!inp || !box) return;
  var last = inp.value.split(',').pop().trim().toLowerCase();
  if(last.length<2){ box.innerHTML = ''; return; }
  var starts = [], inner = [];
  vocab().forEach(function(w){ var lw = w.toLowerCase(); if(lw===last) return; if(lw.indexOf(last)===0) starts.push(w); else if(lw.indexOf(last)>0) inner.push(w); });
  box.innerHTML = starts.concat(inner).slice(0, 6).map(function(w){ return '<button class="chip" data-act="sugpick" data-v="'+esc(w)+'">'+esc(w)+'</button>'; }).join('');
}
document.addEventListener('input', function(ev){ if(ev.target && ev.target.id==='foodIn') showSug(); });
document.addEventListener('focusin', function(ev){ if(ev.target && ev.target.id==='foodIn'){ clearTimeout(flashTimer); var t = document.querySelector('.timer'); if(t) t.style.visibility = 'hidden'; } });
document.addEventListener('focusout', function(ev){ if(ev.target && ev.target.id==='foodIn') setTimeout(function(){ if(document.getElementById('foodIn') && !typing()) saveFood(); }, 150); });
document.addEventListener('keydown', function(ev){ if(ev.target && ev.target.id==='foodIn' && ev.key==='Enter'){ ev.preventDefault(); saveFood(); } });
/* Vorschlag antippen, ohne dass das Feld den Fokus verliert */
document.addEventListener('pointerdown', function(ev){ var b = ev.target.closest && ev.target.closest('[data-act="sugpick"]'); if(b) ev.preventDefault(); });
document.addEventListener('toggle', function(ev){ if(ev.target && ev.target.classList && ev.target.classList.contains('risk')){ st.riskOpen = ev.target.open; persist(); } }, true);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ render(); sync(); } });
window.addEventListener('online', sync);
setInterval(function(){ if(document.visibilityState==='visible' && !flash && !ask){ render(); sync(); } }, 60000);
render(); sync();
})();
</script>
